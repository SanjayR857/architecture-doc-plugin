name: Architecture Documentation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Test & Validate Documentation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp/requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Run MCP Server Self-Test
        run: |
          python mcp/doc_mcp_server.py --test

      - name: Validate Sample Project Architecture
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'mcp')
          from doc_mcp_server import parse_dependencies_impl, extract_api_routes_impl, export_html_preview_impl
          
          # Verify AST parsing on sample project
          deps = parse_dependencies_impl('examples/sample_project')
          assert deps['total_files_analyzed'] >= 10, 'Failed to discover all files'
          assert deps['total_dependencies_found'] >= 14, 'Failed to map dependencies'
          assert len(deps['circular_dependencies']) == 0, 'Circular dependencies detected'
          
          # Verify route extraction
          routes = extract_api_routes_impl('examples/sample_project')
          assert routes['total_routes_discovered'] == 8, 'Expected 8 routes'
          
          # Generate preview
          export_html_preview_impl('flowchart TD\n  A[Frontend] --> B[API]', output_path='docs/architecture-preview.html')
          print('CI Validation Succeeded!')
          "

      - name: Upload Diagram Preview Artifact
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: architecture-preview-html
          path: docs/architecture-preview.html
